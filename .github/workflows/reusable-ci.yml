name: Reusable CI

# =============================================================================
# COST CONTRACT — read before adding a job
# =============================================================================
# GitHub bills Actions **per job, rounded up to the next whole minute**. A job
# that finishes in 3 seconds costs the same as one that runs for 59. The org is
# on the Free plan (2,000 min/month for private repos), and in August 2026 this
# workflow family burned 4,277 billed minutes against 1,214 minutes of actual
# compute — 72% of the bill was rounding overhead — and exhausted the month's
# quota on the 14th.
#
# The single worst offender was a `detect-stack` job that ran `[ -f go.mod ]`
# in its own runner. Kerrigan and kerrUI call both this workflow and
# reusable-security.yml, so they paid for it TWICE per run: 210 billed minutes
# across Aug 1-20 for two `if` statements. It is gone. Callers now declare
# `stack` statically, because a repository's language does not change between
# pushes.
#
# Consequences for anyone editing this file:
#   - A new job costs >= 1 billed minute on EVERY run of EVERY calling repo.
#     Prefer adding a step to an existing job.
#   - Jobs skipped by `if:` are free. Language gating is not the waste; the
#     detector job was.
#   - Never install a tool by compiling it from source (`go install ...`) when
#     a release binary exists. See the Gitleaks note in reusable-security.yml.
#   - `concurrency` must live in the CALLING workflow, not here: inside a called
#     workflow `github.ref` resolves to the caller's ref, so a group defined
#     here would collide across repositories.
# =============================================================================

on:
  workflow_call:
    inputs:
      stack:
        description: >-
          Repository tech stack: go | node | python. Declared statically by the
          caller — this replaced a per-run detection job that cost a full billed
          minute on every run. See the cost contract above.
        required: true
        type: string
      is-vite:
        description: 'Whether the Node project is Vite-based (enables the Vite artifact cache)'
        required: false
        type: boolean
        default: false
      go-version:
        description: 'Go version'
        required: false
        type: string
        default: '1.23'
      node-version:
        description: 'Node.js version'
        required: false
        type: string
        default: '20'
      python-version:
        description: 'Python version'
        required: false
        type: string
        default: '3.11'

permissions:
  contents: read
  checks: write

jobs:
  ci-go:
    name: CI (Go)
    if: inputs.stack == 'go'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v5.3.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests with coverage
        run: go test ./... -race -coverprofile=coverage.out

      - name: Check test coverage
        run: |
          if [ -f coverage.out ]; then
            COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
            echo "Total coverage: $COVERAGE%"
            if (( $(echo "$COVERAGE < 70" | bc -l 2>/dev/null || echo 0) )); then
              echo "::warning::Coverage $COVERAGE% is below 70% threshold"
            fi
          fi

      - name: Run linter
        uses: golangci/golangci-lint-action@v8
        with:
          # Pinned, not `latest`: an unpinned linter makes CI results
          # irreproducible across runs and silently widens the supply-chain
          # surface on every invocation.
          version: v2.13.2
          # Report only issues introduced by the change under test — most org
          # repos predate linting and a full-repo report would drown PRs.
          only-new-issues: true

      - name: Build binaries
        run: go build ./...

  ci-node:
    name: CI (Node.js/TypeScript/Vite)
    if: inputs.stack == 'node'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Vite build artifacts
        if: inputs.is-vite
        uses: actions/cache@v4
        with:
          path: node_modules/.vite
          key: ${{ runner.os }}-vite-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-vite-

      - name: Run linter
        run: npm run lint --if-present

      - name: Run type check
        run: npm run type-check --if-present

      - name: Run tests
        run: npm test --if-present

      - name: Build production bundle (Vite/Next/Web)
        run: npm run build --if-present

  ci-python:
    name: CI (Python)
    if: inputs.stack == 'python'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi

      - name: Run linter (Ruff)
        run: |
          pip install ruff
          ruff check . || echo "::warning::Ruff linting found issues"

      - name: Run type checker (MyPy)
        run: |
          pip install mypy
          mypy . --ignore-missing-imports || echo "::warning::MyPy found type issues"

      - name: Run tests (Pytest)
        run: |
          pip install pytest pytest-cov
          pytest --cov --cov-report=term-missing --cov-report=xml || echo "::warning::Tests completed with warnings"

  # Safety net for a miswired caller. Skipped — and therefore free — whenever
  # `stack` is one of the three supported values, which is the only way this
  # workflow is meant to be called.
  ci-unknown:
    name: CI (Unknown/Not Configured)
    if: inputs.stack != 'go' && inputs.stack != 'node' && inputs.stack != 'python'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fail loudly on an unsupported stack input
        run: |
          echo "::error::reusable-ci.yml was called with stack='${{ inputs.stack }}'"
          echo "::error::Expected one of: go, node, python"
          exit 1
