name: Reusable Security Scanning

# =============================================================================
# COST CONTRACT — see the long-form version in reusable-ci.yml
# =============================================================================
# Jobs bill per job, rounded up to the whole minute. Two changes here, both
# measured against Aug 1-20 2026 (pre-lockout):
#
#   - `detect-stack` removed. It ran `[ -f go.mod ]` in its own runner and cost
#     53 (Kerrigan) + 33 (kerrUI) + 38 (lwx-infra) = 124 billed minutes in 20
#     days from THIS file alone, and reusable-ci.yml charged the same again.
#     Callers now pass `stack` statically.
#
#   - Gitleaks no longer compiles itself from source. `go install
#     github.com/zricethezav/gitleaks/v8@latest` built the tool on every single
#     run — that is why this job cost 1.4 min/run on Kerrigan and 2.5 min/run on
#     lwx-infra to scan repos that take seconds to scan. It now downloads a
#     pinned release binary. This also removes an unpinned `@latest` from the
#     supply chain.
#
# Full-history scanning (`fetch-depth: 0`) is deliberately KEPT. This org has
# had a real credential leak, and a secret scanner that only sees the tip
# commit cannot find a secret that was committed and then removed.
# =============================================================================

on:
  workflow_call:
    inputs:
      stack:
        description: >-
          Repository tech stack: go | node | python. Declared statically by the
          caller — this replaced a per-run detection job that cost a full billed
          minute on every run.
        required: true
        type: string
      go-version:
        description: 'Go version'
        required: false
        type: string
        default: '1.23'

permissions:
  contents: read

env:
  # Pinned tool versions. Never use `latest` here: it makes scan results
  # irreproducible run-to-run and silently widens the supply-chain surface.
  GITLEAKS_VERSION: '8.30.1'
  SEMGREP_VERSION: '1.175.0'

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Install Semgrep
        run: pip install --disable-pip-version-check "semgrep==${SEMGREP_VERSION}"

      # Informational only, matching the prior CodeQL job's behavior (findings
      # annotated, never blocked a merge). Metrics disabled: no telemetry to
      # Semgrep Inc. Rules are pulled from the public registry, no login/API key.
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --metrics=off \
            --text \
            --output semgrep-report.txt \
            . || true
          cat semgrep-report.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.txt
          retention-days: 30

  govulncheck:
    name: Go vulnerability scan
    if: inputs.stack == 'go'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v5.3.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1.0.4
        with:
          go-version-input: ${{ inputs.go-version }}

  trivy:
    name: Trivy filesystem vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      # Installed directly from upstream's own install script rather than a
      # marketplace action wrapper - sidesteps action-pin breakage like the
      # trivy-action@v0.29.0 -> aquasecurity/setup-trivy@v0.2.2 failure.
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Run Trivy vulnerability scanner
        run: |
          trivy fs \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format table \
            --exit-code 0 \
            --output trivy-report.txt \
            .
          cat trivy-report.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt
          retention-days: 30

  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          # Full history is required: a secret that was committed and later
          # removed is invisible to a shallow clone, and that is exactly the
          # case a secret scanner exists to catch.
          fetch-depth: 0

      # gitleaks the CLI is MIT-licensed and free; the GITLEAKS_LICENSE wall
      # only applies to the gitleaks/gitleaks-action wrapper for org accounts.
      # Installing the CLI directly avoids that wall entirely.
      #
      # This downloads the prebuilt release binary. It previously ran
      # `go install ...@latest`, which set up a Go toolchain and COMPILED
      # gitleaks from source on every run — the dominant cost of this job.
      - name: Install Gitleaks
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks
        run: gitleaks detect --source . --redact -v

  npm-audit:
    name: npm dependency audit
    if: inputs.stack == 'node'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (fail on high/critical)
        run: npm audit --audit-level=high

  pip-audit:
    name: Python dependency audit
    if: inputs.stack == 'python'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: |
          if [ -f requirements.txt ]; then pip-audit -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip-audit .; fi
