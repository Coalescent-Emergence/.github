name: Reusable Security Scanning

on:
  workflow_call:

permissions:
  contents: read

jobs:
  detect-stack:
    name: Detect tech stack
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      stack: ${{ steps.detect.outputs.stack }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Detect tech stack for security rules
        id: detect
        run: |
          if [ -f "go.mod" ]; then
            echo "stack=go" >> "$GITHUB_OUTPUT"
          elif [ -f "package.json" ]; then
            echo "stack=node" >> "$GITHUB_OUTPUT"
          elif [ -f "requirements.txt" ] || [ -f "pyproject.toml" ]; then
            echo "stack=python" >> "$GITHUB_OUTPUT"
          else
            echo "stack=unknown" >> "$GITHUB_OUTPUT"
          fi

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Install Semgrep
        run: pip install --disable-pip-version-check semgrep

      # Informational only, matching the prior CodeQL job's behavior (findings
      # annotated, never blocked a merge). Metrics disabled: no telemetry to
      # Semgrep Inc. Rules are pulled from the public registry, no login/API key.
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --metrics=off \
            --text \
            --output semgrep-report.txt \
            . || true
          cat semgrep-report.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.txt
          retention-days: 30

  govulncheck:
    name: Go vulnerability scan
    needs: detect-stack
    if: needs.detect-stack.outputs.stack == 'go'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Go
        uses: actions/setup-go@v5.3.0
        with:
          go-version: '1.23'
          cache: true

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1.0.4
        with:
          go-version-input: '1.23'

  trivy:
    name: Trivy filesystem vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      # Installed directly from upstream's own install script rather than a
      # marketplace action wrapper - sidesteps action-pin breakage like the
      # trivy-action@v0.29.0 -> aquasecurity/setup-trivy@v0.2.2 failure.
      - name: Install Trivy
        run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Run Trivy vulnerability scanner
        run: |
          trivy fs \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format table \
            --exit-code 0 \
            --output trivy-report.txt \
            .
          cat trivy-report.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt
          retention-days: 30

  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5.3.0
        with:
          go-version: '1.23'
          cache: false

      # gitleaks the CLI is MIT-licensed and free; the GITLEAKS_LICENSE wall
      # only applies to the gitleaks/gitleaks-action wrapper for org accounts.
      # Installing and running the CLI directly avoids that wall entirely.
      - name: Install Gitleaks
        run: go install github.com/gitleaks/gitleaks/v8@latest

      - name: Run Gitleaks
        run: gitleaks detect --source . --redact -v

  npm-audit:
    name: npm dependency audit
    needs: detect-stack
    if: needs.detect-stack.outputs.stack == 'node'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (fail on high/critical)
        run: npm audit --audit-level=high

  pip-audit:
    name: Python dependency audit
    needs: detect-stack
    if: needs.detect-stack.outputs.stack == 'python'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: |
          if [ -f requirements.txt ]; then pip-audit -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip-audit .; fi
