name: Reusable Infra Validate

on:
  workflow_call:
    inputs:
      fmt-command:
        description: Command used to format infrastructure code.
        required: false
        type: string
        default: make fmt
      validate-command:
        description: Command used to validate infrastructure code.
        required: false
        type: string
        default: make validate

permissions:
  contents: read

jobs:
  infra-validate:
    name: infra-validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Run fmt command
        shell: bash
        run: ${{ inputs.fmt-command }}

      - name: Run validate command
        shell: bash
        run: ${{ inputs.validate-command }}