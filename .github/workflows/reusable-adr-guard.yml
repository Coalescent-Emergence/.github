name: Reusable ADR Guard

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  adr-lint:
    name: adr-lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node 18 for markdownlint
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '18'

      - name: Install markdownlint-cli
        run: |
          npm install -g markdownlint-cli@0.32.0

      - name: Run markdownlint on ADRs
        run: |
          if [ -d "docs/decisions" ]; then
            markdownlint "docs/decisions/**/*.md" || exit 1
          else
            echo "No docs/decisions directory found, skipping ADR lint."
          fi